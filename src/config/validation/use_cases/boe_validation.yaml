# BOE 3-Way Validation Use Case
# Validates Bill of Entry against Invoice, Packing List, and Bill of Lading/Airway Bill

use_case:
  name: "boe_validation"
  display_name: "BOE 3-Way Validation"
  description: "Validate BOE against Invoice, Packing List, and BOL/AWB to ensure compliance and correct duty payment"
  version: "1.0"

  # Documents involved in validation
  documents:
    primary:
      type: "bill_of_entry"
      role: "draft"
      required: true
      description: "Bill of Entry draft to be validated"

    supporting:
      - type: "invoice"
        role: "source"
        required: true
        description: "Commercial Invoice from supplier"

      - type: "packing_list"
        role: "source"
        required: true
        description: "Packing List with shipment details"

      - type: "bill_of_lading"
        role: "source"
        required: false
        description: "Bill of Lading (sea) or Airway Bill (air)"
        alternatives:
          - "airway_bill"

  # Normalization rules (applied before validation)
  normalization:
    enabled: true

    # Field synonym mapping (handles French/English variations)
    synonyms:
      hs_code:
        - "HS Code"
        - "HSN Code"
        - "Code SH"
        - "Tariff Code"
        - "Harmonized Code"
        - "hs_code"
        - "hsn_code"
        - "tariff_code"

      net_weight:
        - "Net Weight"
        - "Poids Net"
        - "Net Wt"
        - "Poids net"
        - "weight_net"
        - "poids_net"
        - "net_wt"
        - "NetWeight"
        - "total_net_weight"
        - "total_sent_net_weight"
        - "nett_weight_kg"
        - "net_wt_kg"

      gross_weight:
        - "Gross Weight"
        - "Poids Brut"
        - "Gross Wt"
        - "Poids brut"
        - "weight_gross"
        - "poids_brut"
        - "gross_wt"
        - "GrossWeight"
        - "total_gross_weight"
        - "total_sent_gross_weight"
        - "gross_weight_kg"
        - "gross_wt_kg"

      quantity:
        - "Quantity"
        - "Quantité"
        - "Qty"
        - "Qté"
        - "quantity"
        - "quantite"
        - "total_units"
        - "total_sent_units"

      unit_price:
        - "Unit Price"
        - "Prix Unitaire"
        - "Price per Unit"
        - "unit_price"
        - "prix_unitaire"

      description:
        - "Description"
        - "Product Description"
        - "Item Description"
        - "description"
        - "product_description"

      origin:
        - "Country of Origin"
        - "Origin"
        - "Pays d'Origine"
        - "origin"
        - "country_of_origin"

      incoterm:
        - "Incoterm"
        - "Shipping Condition"
        - "Delivery Terms"
        - "Trade Term"
        - "incoterm"
        - "shipping_condition"
        - "delivery_terms"

      order_number:
        - "Order No"
        - "Order Number"
        - "Our Order Number"
        - "order_number"
        - "order_no"

      po_number:
        - "PO Number"
        - "Your Order Number"
        - "Customer Reference"
        - "po_number"
        - "customer_reference"

      contract_number:
        - "Contract No"
        - "Contract Number"
        - "contract_number"

      cpc_code:
        - "CPC"
        - "CPC Concess"
        - "Customs Procedure Code"
        - "cpc_code"
        - "customs_code"

      declarant_name:
        - "Declarant"
        - "Declarant / Representative"
        - "Representative"
        - "Customs Agent"
        - "Clearing Agent"
        - "declarant_name"
        - "declarant_representative"  # GRA BOE Field 9 raw key (snake_case of label)

      declarant_reg_number:
        - "declarant_reg_number"
        - "declarant_no"              # GRA BOE Field 9 registration sub-field
        - "CH Number"
        - "Agent Reg No"
        - "License Number"

      container_count:
        - "No of Containers"
        - "Number of Containers"
        - "Container Count"
        - "container_count"

      total_fob_value:
        - "Total FOB"
        - "FOB Value"
        - "Total FOB Value"
        - "FOB Amount"
        - "total_fob_value"
        - "fob_value"
        - "total_excl_vat"
        - "total_fob_fcy"

      currency:
        - "Currency"
        - "currency"
        - "curr_code"
        - "total_excl_vat_currency"
        - "total_fob_currency"

    # Unit conversions
    units:
      weight:
        target: "KG"
        conversions:
          LBS: 0.453592
          MT: 1000
          G: 0.001
          TON: 1000
          T: 1000
          TONS: 1000

      currency:
        target: "USD"
        # Will use live exchange rates from API
        source: "exchange_rate_api"
        fallback_rates:
          EUR: 1.1
          GBP: 1.3
          JPY: 0.0091
          CAD: 0.79
          CHF: 1.12

    # Format standardization
    formats:
      date:
        target: "YYYY-MM-DD"
        sources:
          - "DD/MM/YYYY"
          - "MM/DD/YYYY"
          - "DD-MMM-YYYY"
          - "YYYY/MM/DD"
          - "DD.MM.YYYY"

      decimal:
        decimal_separator: "."
        thousands_separator: ","
        precision: 2

      currency:
        position: "prefix"
        symbol: "$"

  # Validation workflow
  workflow:
    type: "sequential"  # Execute steps in order

    steps:
      # Step 1: Shipper/Consignee Cross-Document Validation
      - name: "shipper_consignee_validation"
        description: "Verify shipper and consignee name and address match across BOE, Invoice, PL, and BL/AWB"
        validators:
          - "shipper_consignee_validator"
        config:
          parties:
            - name: "shipper"
              documents:
                - "bill_of_entry"
                - "invoice"
                - "bill_of_lading"
              field_mappings:
                bill_of_entry: "shipper_name"
                invoice: "shipper_name"
                bill_of_lading: "shipper_name"
              address_mappings:
                bill_of_entry: "shipper_address"
                invoice: "shipper_address"
                bill_of_lading: "shipper_address"
              match_type: "fuzzy"
              fuzzy_threshold: 0.65
              check_address: true

            - name: "consignee"
              documents:
                - "bill_of_entry"
                - "invoice"
                - "packing_list"
                - "bill_of_lading"
              field_mappings:
                bill_of_entry: "consignee_name"
                invoice: "consignee_name"
                packing_list: "consignee_name"
                bill_of_lading: "consignee_name"
              address_mappings:
                # BOE carries the registered physical office address which legitimately
                # differs from the postal/mailing address on commercial documents —
                # exclude BOE from address cross-check, name cross-check still runs.
                # Invoice carries bill-to; PL/BOL carry ship-to — same low threshold
                # applied to tolerate structural address role differences.
                invoice: "consignee_address"
                packing_list: "consignee_address"
                bill_of_lading: "consignee_address"
              match_type: "fuzzy"
              fuzzy_threshold: 0.8
              address_threshold: 0.1
              check_address: true

          normalization:
            remove_whitespace: true
            remove_punctuation: true
            lowercase: true
            remove_company_suffixes: true
        on_failure: "flag_and_continue"

      # Step 2: Check that all required fields exist
      - name: "field_extraction_check"
        description: "Verify all required fields were extracted"
        validators:
          - "required_fields_validator"
        config:
          required_fields:
            bill_of_entry:
              - "hs_code"
              - "gross_weight"
              - "quantity"
              - "duty_rate"
            invoice:
              - "net_weight"
              - "quantity"
            packing_list:
              - "net_weight"
              - "gross_weight"
        on_failure: "flag_and_continue"

      # Step 2: HS Code must match exactly across all documents
      # Note: commercial invoices and packing lists often do not contain HS codes —
      # those are declared by the customs broker.  require_all: false means the check
      # only runs when the field is present in at least 2 documents.
      - name: "hs_code_3way_matching"
        description: "HS Code must match across BOE, Invoice, Packing List, and BOL (when present)"
        validators:
          - "n_way_matcher"
        config:
          field_name: "hs_code"
          documents:
            - "bill_of_entry"
            - "invoice"
            - "packing_list"
            - "bill_of_lading"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      # Step 3: Weight matching with tolerance
      - name: "weight_matching"
        description: "Validate net and gross weights match within tolerance"
        validators:
          - "tolerance_validator"
        config:
          tolerance_type: "percentage"
          default_tolerance: 1.0
          per_session_override: true

          validations:
            # GRA BOE forms only show gross mass — skip net_weight vs BOE checks.
            # Net weight cross-check between invoice and packing list is still validated.
            - name: "net_weight_invoice_to_packing"
              source: "invoice.net_weight"
              target: "packing_list.net_weight"
              tolerance_percent: 1.0
              operator: "equals"

            - name: "gross_weight_invoice_to_packing"
              source: "invoice.gross_weight"
              target: "packing_list.gross_weight"
              tolerance_percent: 1.0
              operator: "equals"

            - name: "gross_weight_packing_to_boe"
              source: "packing_list.gross_weight"
              target: "bill_of_entry.gross_weight"
              tolerance_percent: 1.0
              operator: "equals"

            - name: "gross_weight_bol_to_invoice"
              source: "bill_of_lading.gross_weight"
              target: "invoice.gross_weight"
              tolerance_percent: 1.0
              operator: "equals"

            - name: "net_weight_bol_to_invoice"
              source: "bill_of_lading.net_weight"
              target: "invoice.net_weight"
              tolerance_percent: 1.0
              operator: "equals"

            # Checklist: "Packing list & Bill of lading weights should align"
            - name: "gross_weight_bol_to_packing"
              source: "bill_of_lading.gross_weight"
              target: "packing_list.gross_weight"
              tolerance_percent: 1.0
              operator: "equals"

            - name: "net_weight_bol_to_packing"
              source: "bill_of_lading.net_weight"
              target: "packing_list.net_weight"
              tolerance_percent: 1.0
              operator: "equals"
        on_failure: "flag_and_continue"

      # Step 4: Quantity matching
      - name: "quantity_matching"
        description: "Validate quantities match across documents"
        validators:
          - "tolerance_validator"
        config:
          tolerance_type: "percentage"
          default_tolerance: 0.5

          validations:
            # Compare quantity between invoice and packing list (same unit — bags).
            # BOE quantity is in different units (pallets/containers) so BOE vs vendor
            # doc quantity is not directly comparable without a conversion factor.
            - name: "quantity_invoice_to_packing"
              source: "invoice.quantity"
              target: "packing_list.quantity"
              tolerance_percent: 0.5
              operator: "equals"
        on_failure: "flag_and_continue"

      # Step 5: Duty calculation verification
      - name: "duty_calculation"
        description: "Verify duty amount is correctly calculated"
        validators:
          - "calculation_validator"
        config:
          calculations:
            - name: "duty_amount"
              formula: "customs_value * duty_rate"
              fields:
                customs_value: "bill_of_entry.customs_value"
                duty_rate: "bill_of_entry.duty_rate"
              target: "bill_of_entry.duty_amount"
              tolerance_percent: 0.5
              description: "Duty amount = CIF customs value × duty rate"
        on_failure: "flag_and_continue"

      # Step 5b: CIF customs value verification
      # Customs value (CIF) = FOB Ncy + Freight Ncy + Insurance Ncy (all in GHS on the BOE)
      # Uses BOE's own GHS-converted values so the check is incoterm-agnostic.
      # For FCA/FOB shipments the invoice carries no freight/insurance — using invoice
      # fields would always produce missing-field errors on those incoterms.
      - name: "cif_calculation_check"
        description: "Verify BOE customs value equals FOB Ncy + Freight Ncy + Insurance Ncy"
        validators:
          - "calculation_validator"
        config:
          calculations:
            - name: "cif_customs_value"
              formula: "fob_ncy + freight_value + insurance_value"
              fields:
                fob_ncy: "bill_of_entry.fob_ncy"
                freight_value: "bill_of_entry.freight_value"
                insurance_value: "bill_of_entry.insurance_value"
              target: "bill_of_entry.customs_value"
              tolerance_percent: 1.0
              description: "Customs Value = FOB Ncy + Freight Ncy + Insurance Ncy (all GHS)"
        on_failure: "flag_and_continue"

      # Step 6: Duty rate range validation
      - name: "duty_rate_validation"
        description: "Ensure duty rate is within valid range"
        validators:
          - "range_validator"
        config:
          validations:
            - field: "duty_rate"
              min: 0
              max: 1.0
              operator: "within_range"
              inclusive: true
              required: true
        on_failure: "flag_and_continue"

      # Step 7: HS Code format validation — accepts 6-digit (1901.90), 10-digit (1901902000)
      # Ghana uses full 10-digit tariff codes; standard HS is 6 digits.
      - name: "hs_code_format"
        description: "Validate HS Code format — XXXX.XX or 6-10 digit numeric"
        validators:
          - "regex_validator"
        config:
          validations:
            - field: "hs_code"
              pattern: "^(\\d{4}\\.\\d{2}(\\.\\d{2}(\\.\\d{2})?)?|\\d{6,10})$"
              description: "HS Code format (XXXX.XX or 6-10 digit numeric)"
              required: false
        on_failure: "flag_and_continue"

      # Step 8: Customs Code Validation (NEW - Sprint 1)
      - name: "customs_code_validation"
        description: "Validate customs code-specific rules (40E68, 40V02, 40U01, 40W01)"
        validators:
          - "customs_code_validator"
        config:
          customs_codes:
            "40E68":
              vat_rate: 0.05    # Import Duty = 5% × customs_value
            "40V02":
              vat_rate: 0.15    # VAT deferred: check vat_amount==0; exempted = 15%×(customs_value+duty_amount)
            "40U01":
              vat_rate: 0.05
            "40W01":
              vat_rate: 0.05
            "40C01":
              duty_rate: 0.02   # 2% import duty
            "40D01":
              duty_rate: null   # N/A — no specific validation required

          validations:
            - customs_value_field: "bill_of_entry.customs_value"
              amount_payable_field: "bill_of_entry.amount_payable"
              amount_exempted_field: "bill_of_entry.amount_exempted"
              duty_amount_field: "bill_of_entry.duty_amount"
              vat_amount_field: "bill_of_entry.vat_amount"
              customs_code_field: "bill_of_entry.customs_code"

          tolerance: 0.01  # ±$0.01 for rounding
        on_failure: "flag_and_continue"

      # Step 10: Mode of Shipment Validation
      - name: "mode_of_shipment_validation"
        description: "Validate transport document matches Section 21 mode"
        validators:
          - "mode_of_shipment_validator"
        config:
          section_21_field: "bill_of_entry.entry_exit_code"
        on_failure: "flag_and_continue"

      # Step 11: Incoterm Validation
      # FCA/FOB: no freight/insurance on invoice.
      # CFR: freight must be present on invoice.
      # CIF: freight and insurance must both be present on invoice.
      # CIF customs value check uses BOE fields (all GHS) — invoice fields are FCY.
      - name: "incoterm_validation"
        description: "Validate freight/insurance charges are consistent with Incoterm"
        validators:
          - "incoterm_validator"
        config:
          validations:
            - incoterm_field: "invoice.incoterm"
              freight_field: "invoice.freight_value"
              insurance_field: "invoice.insurance_value"
              fob_field: "invoice.total_fob_value"
          tolerance: 0.01
        on_failure: "flag_and_continue"

      # Step 13: Declarant must be present and have a registration number
      - name: "declarant_check"
        description: "Verify declarant (clearing agent) is identified with name, address, and registration number"
        validators:
          - "required_fields_validator"
        config:
          required_fields:
            bill_of_entry:
              - "declarant_name"
              - "declarant_address"
              - "declarant_reg_number"
        on_failure: "flag_and_continue"

      # Step 14: FOB value on BOE must match invoice total (within 0.5%)
      - name: "fob_value_crosscheck"
        description: "BOE FOB value must match invoice total FOB value"
        validators:
          - "tolerance_validator"
        config:
          tolerance_type: "percentage"
          default_tolerance: 0.5

          validations:
            - name: "fob_boe_to_invoice"
              source: "bill_of_entry.total_fob_value"
              target: "invoice.total_fob_value"
              tolerance_percent: 0.5
              operator: "equals"
        on_failure: "flag_and_continue"

      # Step 14b: Invoice number on BOE must match invoice number on commercial invoice
      - name: "invoice_number_crosscheck"
        description: "Invoice number declared on BOE must match the commercial invoice number"
        validators:
          - "n_way_matcher"
        config:
          field_name: "invoice_number"
          documents:
            - "bill_of_entry"
            - "invoice"
          match_type: "exact"
          require_all: true
        on_failure: "flag_and_continue"

      # Step 15: Incoterm must match between BOE and invoice
      - name: "incoterm_cross_doc"
        description: "Incoterm on BOE must match incoterm on invoice"
        validators:
          - "n_way_matcher"
        config:
          field_name: "incoterm"
          documents:
            - "bill_of_entry"
            - "invoice"
          match_type: "incoterm"  # extracts 3-letter code only (e.g. "FCA TEMA" → "FCA")
          require_all: false
        on_failure: "flag_and_continue"

      # Step 16: Currency must match between BOE and invoice
      - name: "currency_consistency"
        description: "Currency code must match between BOE and invoice"
        validators:
          - "n_way_matcher"
        config:
          field_name: "currency"
          documents:
            - "bill_of_entry"
            - "invoice"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      # Step 17: Country of origin must be present on BOE
      - name: "country_of_origin_check"
        description: "Country of origin must be declared on BOE"
        validators:
          - "required_fields_validator"
        config:
          required_fields:
            bill_of_entry:
              # "country_of_origin" normalises to canonical "origin" via synonym mapping
              - "origin"
        on_failure: "flag_and_continue"

      # Step 19: BOE section 17 (port of loading) must match BOL port of loading
      # Checklist: "Ensure section 17 on BOE matches port of loading on BL"
      # BOE field: port_of_loading (extracted from Field 17 "Port of Loading/Unloading")
      # BOL field: port_of_loading (extracted from the port of loading field on the BL)
      # require_all: false — BOL is optional; skipped gracefully when not uploaded.
      - name: "origin_cross_check"
        description: "BOE section 17 port of loading must match BOL port of loading (when BOL present)"
        validators:
          - "n_way_matcher"
        config:
          field_name: "port_of_loading"
          documents:
            - "bill_of_entry"
            - "bill_of_lading"
          match_type: "fuzzy"
          # Threshold lowered to 0.6: BOE uses LOCODE/port code ("BEANR Antwerpen")
          # while BOL uses plain name ("ANTWERP") — same port, different notation.
          fuzzy_threshold: 0.6
          require_all: false
        on_failure: "flag_and_continue"

      # Step 18: Container count must match between BOE description and bill of lading
      - name: "container_count_consistency"
        description: "Container count must match between BOE and bill of lading"
        validators:
          - "n_way_matcher"
        config:
          field_name: "container_count"
          documents:
            - "bill_of_entry"
            - "bill_of_lading"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      # Step 19: ETLS approval number required when import duty rate is zero
      # When duty_rate = 0 and CPC code is 40U01/40W01, an ETLS approval
      # number must be referenced. etls_only: true skips the amount calculations
      # already done in step 8 to avoid duplicate discrepancies.
      - name: "etls_approval_check"
        description: "ETLS approval number required when import duty is zero (40U01/40W01)"
        validators:
          - "customs_code_validator"
        config:
          etls_only: true
          customs_codes:
            "40U01":
              vat_rate: 0.05
              require_etls_approval: true
            "40W01":
              vat_rate: 0.05
              require_etls_approval: true

          validations:
            - customs_value_field: "bill_of_entry.customs_value"
              amount_payable_field: "bill_of_entry.amount_payable"
              amount_exempted_field: "bill_of_entry.amount_exempted"
              duty_amount_field: "bill_of_entry.duty_amount"
              vat_amount_field: "bill_of_entry.vat_amount"
              customs_code_field: "bill_of_entry.customs_code"
              etls_approval_field: "bill_of_entry.etls_approval_number"

          tolerance: 0.01
        on_failure: "flag_and_continue"

      # Step 20: Master Concession eligibility check
      # When CPC code is 40U01/40W01 and duty = 0, each BOE line item HS code
      # must appear in the approved Master Concession list. Also validates the
      # concession reference number and that the concession has not expired.
      - name: "master_concession_eligibility_check"
        description: "Verify BOE items claiming zero duty are approved under the Master Concession (MD202601CUSTCU030000003304)"
        validators:
          - "concession_eligibility_validator"
        config:
          # Path to the master concession reference data
          concession_data_path: "config/data/master_concession.yaml"

          # CPC codes that require concession eligibility check
          applicable_cpc_codes:
            - "40U01"
            - "40W01"

          # BOE fields
          customs_code_field: "bill_of_entry.customs_code"
          concession_ref_field: "bill_of_entry.etls_approval_number"
          shipment_date_field: "bill_of_entry.declaration_date"
          line_items_field: "bill_of_entry.items"
          item_hs_code_field: "hs_code"
          item_description_field: "product_description"

          # Matching strategy: hs_code is the primary key; description is fuzzy-matched as secondary confirmation
          match_strategy: "hs_code_primary"
          description_similarity_threshold: 0.60

          # Validation rules
          validations:
            check_concession_reference: true       # BOE must cite MD202601CUSTCU030000003304
            check_expiry_date: true                # Concession expires 2026-12-31
            check_item_eligibility: true           # Each HS code must be on the approved list
            flag_unmatched_items: true             # Flag items not found in concession

        on_failure: "flag_and_continue"

      # Step 22: VAT deferment eligibility check
      # When CPC code is 40V02, each BOE line item HS code must appear in the
      # approved VAT deferment list (URV 0014). If not found, VAT deferment
      # cannot be applied and the shipment is non-compliant.
      - name: "vat_deferment_eligibility_check"
        description: "Verify BOE items claiming VAT deferment are on the approved VAT deferment list (URV 0014)"
        validators:
          - "vat_deferment_validator"
        config:
          vat_data_path: "config/data/vat_deferment_list.yaml"
          applicable_cpc_codes:
            - "40V02"
          customs_code_field: "bill_of_entry.customs_code"
          line_items_field: "bill_of_entry.items"
          item_hs_code_field: "hs_code"
          item_description_field: "product_description"
          validations:
            check_item_eligibility: true
        on_failure: "flag_and_continue"

      # Step 23: Insurance rate verification for FCA/CFR shipments
      - name: "insurance_rate_check"
        description: "Verify insurance amount matches Ghana customs insurance rate of C&F value"
        validators:
          - "incoterm_validator"
        config:
          # Ghana customs insurance rates (percentage of C&F value)
          insurance_rate_sea_road: 0.00875  # 0.875% for sea and road shipments
          insurance_rate_air: 0.01          # 1.000% for air shipments
          # Entry/exit code prefixes that indicate air transport
          air_entry_prefixes:
            - "KIA"
          validations:
            - incoterm_field: "invoice.incoterm"
              freight_field: "bill_of_entry.freight_value"
              insurance_field: "bill_of_entry.insurance_value"
              # fob_ncy = FOB in GHS (Field 19/34) — same currency as freight_value
              # and insurance_value so C&F arithmetic is consistent.
              # total_fob_value is in EUR (FCY) and must NOT be used here.
              fob_field: "bill_of_entry.fob_ncy"
              cif_field: "bill_of_entry.customs_value"
              transport_mode_field: "bill_of_entry.entry_exit_code"
              check_insurance_rate: true
          tolerance: 0.01
        on_failure: "flag_and_continue"

  # Discrepancy handling — all discrepancies are equal weight (no severity tiers)
  discrepancy_handling:
    classification:
      enabled: true

  # Version control
  versioning:
    enabled: true
    track_changes: true

    # Revalidation rules (when V2 is uploaded)
    revalidation:
      on_new_version: true
      compare_with_previous: true

      comparison_rules:
        - check: "fixed_discrepancies"
          expected: "all_fixed"
          description: "All previous discrepancies should be fixed"

        - check: "new_discrepancies"
          expected: "none_critical"
          description: "No new critical discrepancies introduced"

        - check: "unchanged_correct_fields"
          expected: "all_unchanged"
          description: "Previously correct fields should remain unchanged"

      pass_criteria:
        - "all_critical_fixed"
        - "no_new_critical"

  # Missing data handling
  missing_data:
    strategy: "continue_with_partial"  # User choice: continue with partial validation

    # Fields that are often missing and should prompt user
    prompt_fields:
      - field: "freight_value"
        message: "Freight value not found in documents. Would you like to provide it?"
        optional: true

      - field: "insurance_value"
        message: "Insurance value not found in documents. Would you like to provide it?"
        optional: true

    # Mark validation as incomplete if critical fields missing
    incomplete_if_missing:
      - "hs_code"
      - "net_weight"
      - "duty_rate"

  # Automation triggers
  automation:
    # Automatically send correction email after discrepancy detection
    on_discrepancy_detected:
      - action: "send_correction_email"
        condition: "user_confirmed_discrepancy"
        template: "boe_correction_request"
        recipients: "customs_agent"

    # Update validation status
    on_validation_complete:
      - action: "update_status"
        target: "validation_session"

    # Mark as validated and notify
    on_revalidation_pass:
      - action: "mark_as_validated"
      - action: "notify_user"
        message: "BOE V2 validation passed. All discrepancies resolved."

  # Reporting
  reporting:
    enabled: true

    templates:
      summary: "boe_validation_summary"
      detailed: "boe_validation_detailed"
      comparison: "boe_version_comparison"

    export_formats:
      - "json"
      - "pdf"
      - "csv"

    include:
      - "validation_results"
      - "discrepancies_by_severity"
      - "discrepancies_by_field"
      - "auto_fixes_applied"
      - "user_confirmations"
      - "version_history"
      - "audit_trail"
      - "performance_metrics"

  # Performance targets
  performance:
    max_processing_time_seconds: 30
    target_accuracy: 0.995  # 99.5%
    false_positive_rate_max: 0.02  # 2%

  # Metadata
  metadata:
    created_by: "Nestle Customs Team"
    created_at: "2026-02-09"
    use_case_category: "customs_clearance"
    compliance_standard: "WCO_SAFE"
    business_impact: "high"
    penalty_risk: "92%"
