# Normalization Configuration
# Handles field name variations, unit conversions, and format standardization

normalization:
  # Strategy for field name resolution
  # - config_only: Use only predefined synonym mappings
  # - llm_only: Use only LLM for semantic matching
  # - hybrid: Try config first, fallback to LLM
  strategy: "config_only"

  # Synonym mapping for field names
  synonym_mapping:
    # Enable synonym resolution
    enabled: true

    # LLM fallback configuration
    # Disabled: Claude handles semantic extraction in the ai_enhancement step.
    # A secondary LLM pass for synonym matching is redundant and adds latency.
    llm_fallback:
      enabled: false
      provider: "google"
      model: "default"
      confidence_threshold: 0.8
      cache_successful_mappings: true
      max_retries: 2

    # Global synonym dictionary
    # Format: canonical_name: [list of synonyms]
    #
    # RULE: List all known label variants for the same logical field.
    # Includes both same-label variants (abbreviations, case) AND
    # semantically equivalent labels from different document types
    # (e.g. "Your Order Number" and "Customer Ref." both → po_number).
    # This allows the SynonymMapper to resolve any document label to
    # its canonical name for the UI checklist, regardless of supplier.
    synonyms:
      # Customs and trade
      hs_code:
        - "HS Code"
        - "hs_code"

      customs_value:
        - "Customs Value"
        - "customs_value"

      duty_rate:
        - "Duty Rate"
        - "duty_rate"

      duty_amount:
        - "Duty Amount"
        - "duty_amount"

      # Weight fields
      net_weight:
        - "Net Weight"
        - "Net Wt"
        - "net_weight"
        - "net_wt"
        - "total_net_weight"    # SAP-style invoice header total
        - "Total Net Weight"
        - "nett_weight_kg"      # BOL totals block
        - "NETT WEIGHT"         # BOL page-2 totals
        - "Nett Weight"
        - "total_sent_net_weight"  # Packing list grand totals

      gross_weight:
        - "Gross Weight"
        - "Gross Wt"
        - "gross_weight"
        - "gross_wt"
        - "total_gross_weight"  # SAP-style invoice header total
        - "Total Gross Weight"
        - "gross_weight_kg"     # BOL totals block
        - "GROSS WEIGHT"        # BOL page-2 totals
        - "total_sent_gross_weight"  # Packing list grand totals

      tare_weight:
        - "Tare Weight"
        - "Tare"
        - "tare_weight"

      # Quantity and pricing
      quantity:
        - "Quantity"
        - "Qty"
        - "quantity"
        - "total_units"     # SAP-style invoice header (total number of units)
        - "Total Units"
        - "Total Qty"
        - "total_qty"
        - "total_sent_units"   # Packing list grand totals
        - "totals_bags"        # BOL page-2 totals
        - "Totals"

      unit_price:
        - "Unit Price"
        - "Price/Unit"
        - "unit_price"

      total_price:
        - "Total Price"
        - "total_price"

      # Product information
      product_description:
        - "Product Description"
        - "product_description"
        - "description"
        - "goods_description"
        - "description_of_goods"
        - "kind_of_packages_description_of_goods"

      product_name:
        - "Product Name"
        - "product_name"

      # Origin and shipping
      origin:
        - "Country of Origin"
        - "origin"
        - "country_of_origin"

      destination:
        - "Destination"
        - "destination"
        - "country_of_destination"

      port_of_loading:
        - "Port of Loading"
        - "POL"
        - "port_of_loading"

      port_of_discharge:
        - "Port of Discharge"
        - "POD"
        - "port_of_discharge"

      # Dates
      invoice_date:
        - "Invoice Date"
        - "invoice_date"

      shipment_date:
        - "Shipment Date"
        - "shipment_date"

      arrival_date:
        - "Arrival Date"
        - "ETA"
        - "arrival_date"

      # Identifiers
      invoice_number:
        - "Invoice Number"
        - "Invoice No"
        - "Invoice #"
        - "invoice_number"

      po_number:
        - "PO Number"
        - "PO No"
        - "Purchase Order"
        - "po_number"
        - "your_order_number"    # Invoice label "Your Order Number"
        - "Your Order Number"
        - "customer_ref"        # PL/BOL label "Customer ref."
        - "customer_reference"
        - "Customer ref."
        - "Customer Ref"
        - "CUSTOMER REF."

      order_number:
        - "Order Number"
        - "Order No"
        - "order_number"
        - "order_no"
        - "our_order_number"    # Invoice label "Our Order Number"
        - "Our Order Number"
        - "Order no."
        - "ORDER NO."

      contract_number:
        - "Contract Number"
        - "Contract No"
        - "contract_number"
        - "contract_no"
        - "Contract no."
        - "Contract No"
        - "CONTRACT NO."

      boe_number:
        - "BOE Number"
        - "Bill of Entry Number"
        - "Entry Number"
        - "BOE No"
        - "boe_number"
        - "bill_of_entry_number"
        - "bill_of_entry_no"

      container_number:
        - "Container Number"
        - "Container No"
        - "container_number"

      container_count:
        - "container_count"
        - "total_no_of_containers"
        - "Total No. of Containers"
        - "number_of_containers"

      container_numbers:
        - "container_numbers"
        - "Container Numbers"

      # Declarant / clearing agent identity
      declarant_name:
        - "declarant_name"
        - "Declarant"

      declarant_reg_number:
        - "declarant_reg_number"

      # Bill of Lading reference number
      bl_number:
        - "bl_number"
        - "B/L No"
        - "BL No"
        - "BL Number"
        - "Bill of Lading No"
        - "Bill of Lading Number"
        - "Bl. No."
        - "B/L Number"
        - "bl_no"
        - "booking_number"
        - "booking_no"
        - "Booking No."
        - "Booking No"

      booking_number:
        - "booking_number"
        - "Booking No"
        - "Booking No."
        - "booking_no"

      # Parties — each role keeps its own label
      shipper_name:
        - "shipper_name"
        - "Shipper"
        - "Seller"
        - "seller"
        - "seller_name"
        - "Exporter"
        - "exporter"
        - "exporter_name"
        - "Supplier"
        - "supplier"
        - "supplier_name"
        - "shipper"              # BOL single field

      shipper_address:
        - "shipper_address"
        - "Shipper Address"
        - "seller_address"      # Invoice extraction

      consignee_name:
        - "consignee_name"
        - "Consignee"
        - "consignee"           # BOL single field
        - "buyer_name"
        - "Buyer"
        - "buyer"
        - "bill_to_name"

      consignee_address:
        - "consignee_address"
        - "Consignee Address"
        - "bill_to_address"
        - "delivery_address"

      # Financial totals — only match the exact label
      total_invoice_value:
        - "Total Invoice Value"
        - "Invoice Total"
        - "total_invoice_value"
        - "invoice_total"
        - "total_incl_vat"      # Invoice label "Total Incl. VAT"
        - "Total Incl. VAT"

      total_fob_value:
        - "Total FOB"
        - "FOB Value"
        - "Total FOB Value"
        - "FOB Amount"
        - "total_fob_value"
        - "fob_value"
        - "total_excl_vat"      # Invoice label "Total Excl. VAT"
        - "Total Excl. VAT"

      # Document dates
      document_date:
        - "Document Date"
        - "document_date"

      # Article / product codes
      article_number:
        - "Article No"
        - "Article No."
        - "Article Number"
        - "article_number"
        - "article_no"

      currency:
        - "Currency"
        - "currency"

      # Incoterms — match fields labeled "Incoterm" or equivalent trade terms
      incoterm:
        - "Incoterm"
        - "Incoterms"
        - "incoterm"
        - "shipping_condition"  # Invoice label "Shipping Condition"
        - "Shipping Condition"
        - "delivery_terms"      # Packing list label "Delivery terms"
        - "Delivery terms"
        - "Delivery Terms"

      # BOE-specific field names (GRA form)
      bill_of_lading:
        - "Bill of Lading"
        - "BL/AWB"
        - "bill_of_lading_number"

      customs_code:
        - "Customs Procedure Code"
        - "customs_code"
        - "cpc_code"

  # Value-level cleanup applied after extraction.
  # These fix VALUE content issues, not field names.
  # The SynonymMapper handles name normalization separately.
  # Rules are keyed by document type. Each rule targets a specific field
  # and applies regex substitutions to clean the extracted value.
  value_cleanups:
    enabled: true

    rules:
      bill_of_lading:
        # Strip container preamble from product description values
        product_description:
          - pattern: '(?i)^\d+\s*(?:ft\.?|foot|feet)?\s*(?:high\s+cube|standard|open\s+top)?\s*container\s+(?:said\s+to\s+contain\s+)?\d+\s*(?:bags?|packages?|units?|cartons?|pallets?)\s*'
            replacement: ""
          - pattern: '(?:,\s*)?Article\s+no\.?:\s*\S+(?:\s*Nett\s+Weight\s+KG:\s*[\d,.]+)?'
            replacement: ""
        # Strip contact details from consignee values
        consignee:
          - pattern: '\s*,?\s*(?:Tel[.:]?|Phone[.:]?|Fax[.:]?|E?-?mail[.:]?)\s*[.:]?\s*.*$'
            replacement: ""
        # Strip contact details from consignee_name (if prompt produced it with details)
        consignee_name:
          - pattern: '\s*,?\s*(?:Tel[.:]?|Phone[.:]?|Fax[.:]?|E?-?mail[.:]?)\s*[.:]?\s*.*$'
            replacement: ""

      invoice:
        # Currency dedup: "EUR 467,775.00 EUR" -> "EUR 467,775.00"
        total_excl_vat:
          - pattern: '^([A-Z]{3})\s+([\d,.]+(?:\.\d+)?)\s+\1$'
            replacement: "\\1 \\2"
        total_incl_vat:
          - pattern: '^([A-Z]{3})\s+([\d,.]+(?:\.\d+)?)\s+\1$'
            replacement: "\\1 \\2"
        # Strip address from shipper_name if it contains one
        shipper_name:
          - pattern: '\n.*'
            replacement: ""

  # Unit conversion configuration
  unit_conversion:
    enabled: true

    # Weight units
    weight:
      target_unit: "KG"
      conversions:
        # To kilograms
        LBS: 0.453592
        LB: 0.453592
        POUNDS: 0.453592
        OZ: 0.0283495
        OUNCES: 0.0283495
        G: 0.001
        GRAMS: 0.001
        MG: 0.000001
        MT: 1000
        METRIC_TON: 1000
        TNE: 1000
        TON: 1000
        TONS: 1000
        T: 1000
        TONNE: 1000
        TONNES: 1000

    # Volume units
    volume:
      target_unit: "M3"
      conversions:
        # To cubic meters
        L: 0.001
        LITERS: 0.001
        LITRES: 0.001
        ML: 0.000001
        MILLILITERS: 0.000001
        GAL: 0.00378541
        GALLONS: 0.00378541
        FT3: 0.0283168
        CUBIC_FEET: 0.0283168
        IN3: 0.0000163871
        CUBIC_INCHES: 0.0000163871

    # Length units
    length:
      target_unit: "M"
      conversions:
        # To meters
        CM: 0.01
        CENTIMETERS: 0.01
        MM: 0.001
        MILLIMETERS: 0.001
        KM: 1000
        KILOMETERS: 1000
        IN: 0.0254
        INCHES: 0.0254
        FT: 0.3048
        FEET: 0.3048
        YD: 0.9144
        YARDS: 0.9144
        MI: 1609.34
        MILES: 1609.34

    # Currency conversion
    currency:
      target_unit: "USD"
      source: "exchange_rate_api"  # Live exchange rates
      api_endpoint: "https://api.exchangerate-api.com/v4/latest/USD"
      cache_ttl: 86400  # 24 hours

      # Fallback rates (used if API is unavailable)
      fallback_rates:
        EUR: 1.1
        GBP: 1.3
        JPY: 0.0091
        CAD: 0.79
        CHF: 1.12
        AUD: 0.72
        CNY: 0.15
        INR: 0.012
        MXN: 0.055
        BRL: 0.19

  # Format normalization
  format_normalization:
    enabled: true

    # Date formats
    date:
      target_format: "YYYY-MM-DD"  # ISO 8601

      supported_formats:
        - "DD/MM/YYYY"
        - "MM/DD/YYYY"
        - "DD-MM-YYYY"
        - "MM-DD-YYYY"
        - "DD.MM.YYYY"
        - "DD-MMM-YYYY"
        - "YYYY/MM/DD"
        - "YYYY-MM-DD"
        - "DD MMM YYYY"
        - "MMM DD, YYYY"
        - "DD MMMM YYYY"
        - "MMMM DD, YYYY"

      # Language support for month names
      languages:
        - "en"
        - "fr"

    # Decimal number formatting
    decimal:
      decimal_separator: "."
      thousands_separator: ","
      precision: 2

      # Handle both formats
      input_separators:
        decimal: [".", ","]
        thousands: [",", ".", " "]

    # Currency formatting
    currency:
      position: "prefix"  # $ before number
      symbol: "$"
      space_after_symbol: false

      # Recognize both formats
      input_positions: ["prefix", "suffix"]

    # Boolean normalization
    boolean:
      true_values:
        - "true"
        - "True"
        - "TRUE"
        - "yes"
        - "Yes"
        - "YES"
        - "oui"
        - "Oui"
        - "OUI"
        - "1"
        - "Y"
        - "y"

      false_values:
        - "false"
        - "False"
        - "FALSE"
        - "no"
        - "No"
        - "NO"
        - "non"
        - "Non"
        - "NON"
        - "0"
        - "N"
        - "n"

  # Language detection
  language_detection:
    enabled: true

    # Supported languages
    languages:
      - code: "en"
        name: "English"
      - code: "fr"
        name: "French"

    # Default language if detection fails
    default_language: "en"

  # Whitespace normalization
  whitespace:
    enabled: true

    # Operations
    trim: true  # Remove leading/trailing whitespace
    collapse: true  # Multiple spaces to single space
    normalize_line_breaks: true  # \r\n to \n

  # Case normalization
  case_normalization:
    # Don't normalize by default (preserve original case)
    # Only normalize when specifically needed (e.g., case_insensitive matching)
    enabled: false
    default_case: "original"  # original, lower, upper, title

  # Caching
  caching:
    enabled: true
    ttl_seconds: 3600  # 1 hour
    max_size: 10000  # Maximum cached entries

  # Performance
  performance:
    parallel_normalization: true  # Normalize fields in parallel
    batch_size: 100  # Fields per batch
    timeout_seconds: 30
