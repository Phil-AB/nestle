# =============================================================================
# Import Checklist for Declarations
# =============================================================================
# Maps checklist items to extraction fields per document type.
# Used when extraction_mode is "focused" — only these fields are extracted.
#
# Source: GRA Ghana Import Checklist for Declarations (2025)
# Documents: Invoice, Packing List, Bill of Lading, Bill of Entry

name: "Import Checklist for Declarations"
version: "2025"
description: "Ghana GRA declaration checklist - fields to validate for every import"

checklist:
  - id: shipper_address
    label: "Shipper's Address"
    status: "Correct"
    source_documents: [invoice, packing_list, bill_of_lading, boe]
    fields:
      invoice: [shipper_name, shipper_address]
      packing_list: [shipper_name]
      bill_of_lading: [shipper_name, shipper_address]
      boe: [shipper_name, shipper_address]

  - id: consignee_address
    label: "Consignee Address"
    status: "Correct"
    source_documents: [invoice, packing_list, bill_of_lading, boe]
    fields:
      invoice: [consignee_name, consignee_address]
      packing_list: [consignee_name]
      bill_of_lading: [consignee_name, consignee_address]
      boe: [consignee_name, consignee_address]

  - id: declarant_address
    label: "Declarant Address"
    status: "Correct"
    source_documents: [boe]
    fields:
      boe: [declarant_name, declarant_address, declarant_reg_number]

  - id: po_number
    label: "PO Number"
    status: "Correct"
    source_documents: [invoice]
    fields:
      invoice: [po_number, order_number]

  - id: product_description
    label: "Product Description"
    status: "Correct"
    source_documents: [invoice]
    item_level: true
    fields:
      invoice: [product_description]

  - id: hs_code
    label: "H.S. Code"
    status: "Correct"
    source_documents: [invoice, packing_list]
    item_level: true
    fields:
      invoice: [hs_code]
      packing_list: [hs_code]

  - id: import_duty
    label: "Import Duty"
    status: "Not Applicable"
    notes: "Import duty rate should be 0 for BOEs with CPC codes 40W01, 40U01. Import duty rate for CPC code 40C01 should be 2%"
    source_documents: [boe]
    fields:
      boe: [duty_rate, duty_amount, cpc_code]

  - id: vat_nhil
    label: "VAT/NHIL"
    status: "Not Applicable"
    notes: "Confirm with VAT/NHIL Relief list"
    source_documents: [boe]
    fields:
      boe: [vat_amount, vat_rate, nhil_amount, nhil_rate]

  - id: cpc_code
    label: "Commodity Code (CPC)"
    status: "Correct"
    notes: "Check with CPC list"
    source_documents: [boe]
    fields:
      boe: [cpc_code]

  - id: fob_value_currency
    label: "FOB Value & Currency"
    status: "Correct"
    source_documents: [invoice, boe]
    fields:
      invoice: [total_fob_value, currency]
      boe: [fob_value, fob_value_local, currency]

  - id: incoterm
    label: "Incoterm"
    status: "Correct"
    source_documents: [invoice, boe]
    fields:
      invoice: [incoterm]
      boe: [incoterm]

  - id: insurance
    label: "Insurance"
    status: "Correct"
    notes: "CIF uses insurance value on invoice. CFR/FCA: apply 0.875% for Sea & Road, 1% for Air on C&F"
    source_documents: [invoice, boe]
    fields:
      invoice: [insurance_value, freight_value, incoterm]
      boe: [insurance_value, freight_value, incoterm]

  - id: freight
    label: "Freight"
    status: "Correct"
    source_documents: [invoice, boe]
    fields:
      invoice: [freight_value]
      boe: [freight_value]

  - id: cargo_weights
    label: "Cargo Gross & Net Weight"
    status: "Correct"
    notes: "Packing list & Bill of lading weights should align"
    source_documents: [packing_list, bill_of_lading, boe]
    fields:
      packing_list: [total_gross_weight, total_net_weight, weight_unit]
      bill_of_lading: [gross_weight, net_weight]
      boe: [gross_weight, net_weight]

  - id: origin_of_goods
    label: "Origin of Goods (Country)"
    status: "Correct"
    notes: "Ensure section 17 on BOE matches port of loading on BL"
    source_documents: [boe]
    fields:
      boe: [country_of_origin]

  - id: quantity
    label: "Quantity of Goods"
    status: "Correct"
    source_documents: [invoice, packing_list, bill_of_lading]
    item_level: true
    fields:
      invoice: [quantity]
      packing_list: [quantity]
      bill_of_lading: [total_packages]

  - id: container_count
    label: "Number of Containers"
    status: "Not Applicable"
    source_documents: [bill_of_lading]
    fields:
      bill_of_lading: [container_count, container_numbers]
