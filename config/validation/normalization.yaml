# Normalization Configuration
# Handles field name variations, unit conversions, and format standardization

normalization:
  # Strategy for field name resolution
  # - config_only: Use only predefined synonym mappings
  # - llm_only: Use only LLM for semantic matching
  # - hybrid: Try config first, fallback to LLM
  strategy: "config_only"

  # Synonym mapping for field names
  synonym_mapping:
    # Enable synonym resolution
    enabled: true

    # LLM fallback configuration
    # Disabled: Claude handles semantic extraction in the ai_enhancement step.
    # A secondary LLM pass for synonym matching is redundant and adds latency.
    llm_fallback:
      enabled: false
      provider: "google"
      model: "default"
      confidence_threshold: 0.8
      cache_successful_mappings: true
      max_retries: 2

    # Global synonym dictionary
    # Format: canonical_name: [list of synonyms]
    #
    # RULE: Only list variants of the SAME label (abbreviations, case, spacing).
    # Do NOT map semantically different labels to the same canonical name.
    # Cross-concept matching (e.g. "Your Order Number" ↔ "po_number") is
    # handled by the use-case field mappings in config/validation/use_cases/.
    synonyms:
      # Customs and trade
      hs_code:
        - "HS Code"
        - "hs_code"

      customs_value:
        - "Customs Value"
        - "customs_value"

      duty_rate:
        - "Duty Rate"
        - "duty_rate"

      duty_amount:
        - "Duty Amount"
        - "duty_amount"

      # Weight fields
      net_weight:
        - "Net Weight"
        - "Net Wt"
        - "net_weight"
        - "net_wt"

      gross_weight:
        - "Gross Weight"
        - "Gross Wt"
        - "gross_weight"
        - "gross_wt"

      tare_weight:
        - "Tare Weight"
        - "Tare"
        - "tare_weight"

      # Quantity and pricing
      quantity:
        - "Quantity"
        - "Qty"
        - "quantity"

      unit_price:
        - "Unit Price"
        - "Price/Unit"
        - "unit_price"

      total_price:
        - "Total Price"
        - "total_price"

      # Product information
      product_description:
        - "Product Description"
        - "product_description"

      product_name:
        - "Product Name"
        - "product_name"

      # Origin and shipping
      origin:
        - "Country of Origin"
        - "origin"
        - "country_of_origin"

      destination:
        - "Destination"
        - "destination"
        - "country_of_destination"

      port_of_loading:
        - "Port of Loading"
        - "POL"
        - "port_of_loading"

      port_of_discharge:
        - "Port of Discharge"
        - "POD"
        - "port_of_discharge"

      # Dates
      invoice_date:
        - "Invoice Date"
        - "invoice_date"

      shipment_date:
        - "Shipment Date"
        - "shipment_date"

      arrival_date:
        - "Arrival Date"
        - "ETA"
        - "arrival_date"

      # Identifiers
      invoice_number:
        - "Invoice Number"
        - "Invoice No"
        - "Invoice #"
        - "invoice_number"

      po_number:
        - "PO Number"
        - "PO No"
        - "Purchase Order"
        - "po_number"

      order_number:
        - "Order Number"
        - "Order No"
        - "order_number"
        - "order_no"

      contract_number:
        - "Contract Number"
        - "Contract No"
        - "contract_number"
        - "contract_no"

      boe_number:
        - "BOE Number"
        - "Bill of Entry Number"
        - "Entry Number"
        - "BOE No"
        - "boe_number"
        - "bill_of_entry_number"
        - "bill_of_entry_no"

      container_number:
        - "Container Number"
        - "Container No"
        - "container_number"

      # Plural form — comma-separated list of container IDs from BOL / packing list
      container_numbers:
        - "container_numbers"
        - "Container Numbers"

      # Declarant / clearing agent identity
      declarant_name:
        - "declarant_name"
        - "Declarant"

      declarant_reg_number:
        - "declarant_reg_number"

      # Bill of Lading reference number
      bl_number:
        - "bl_number"
        - "B/L No"
        - "BL No"
        - "BL Number"
        - "Bill of Lading No"
        - "Bill of Lading Number"
        - "Bl. No."
        - "B/L Number"

      # Parties — each role keeps its own label
      shipper_name:
        - "shipper_name"
        - "Shipper"

      shipper_address:
        - "shipper_address"
        - "Shipper Address"

      consignee_name:
        - "consignee_name"
        - "Consignee"

      consignee_address:
        - "consignee_address"
        - "Consignee Address"

      # Financial totals — only match the exact label
      total_invoice_value:
        - "Total Invoice Value"
        - "Invoice Total"
        - "total_invoice_value"
        - "invoice_total"

      total_fob_value:
        - "Total FOB"
        - "FOB Value"
        - "Total FOB Value"
        - "FOB Amount"
        - "total_fob_value"
        - "fob_value"

      # Document dates
      document_date:
        - "Document Date"
        - "document_date"

      # Article / product codes
      article_number:
        - "Article No"
        - "Article No."
        - "Article Number"
        - "article_number"
        - "article_no"

      currency:
        - "Currency"
        - "currency"

      # Incoterms — only match fields literally labeled "Incoterm/Incoterms".
      incoterm:
        - "Incoterm"
        - "Incoterms"
        - "incoterm"

      # BOE-specific field names (GRA form)
      bill_of_lading:
        - "Bill of Lading"
        - "BL/AWB"
        - "bill_of_lading_number"

      customs_code:
        - "Customs Procedure Code"
        - "customs_code"
        - "cpc_code"

  # Unit conversion configuration
  unit_conversion:
    enabled: true

    # Weight units
    weight:
      target_unit: "KG"
      conversions:
        # To kilograms
        LBS: 0.453592
        LB: 0.453592
        POUNDS: 0.453592
        OZ: 0.0283495
        OUNCES: 0.0283495
        G: 0.001
        GRAMS: 0.001
        MG: 0.000001
        MT: 1000
        METRIC_TON: 1000
        TON: 1000
        TONS: 1000
        T: 1000
        TONNE: 1000
        TONNES: 1000

    # Volume units
    volume:
      target_unit: "M3"
      conversions:
        # To cubic meters
        L: 0.001
        LITERS: 0.001
        LITRES: 0.001
        ML: 0.000001
        MILLILITERS: 0.000001
        GAL: 0.00378541
        GALLONS: 0.00378541
        FT3: 0.0283168
        CUBIC_FEET: 0.0283168
        IN3: 0.0000163871
        CUBIC_INCHES: 0.0000163871

    # Length units
    length:
      target_unit: "M"
      conversions:
        # To meters
        CM: 0.01
        CENTIMETERS: 0.01
        MM: 0.001
        MILLIMETERS: 0.001
        KM: 1000
        KILOMETERS: 1000
        IN: 0.0254
        INCHES: 0.0254
        FT: 0.3048
        FEET: 0.3048
        YD: 0.9144
        YARDS: 0.9144
        MI: 1609.34
        MILES: 1609.34

    # Currency conversion
    currency:
      target_unit: "USD"
      source: "exchange_rate_api"  # Live exchange rates
      api_endpoint: "https://api.exchangerate-api.com/v4/latest/USD"
      cache_ttl: 86400  # 24 hours

      # Fallback rates (used if API is unavailable)
      fallback_rates:
        EUR: 1.1
        GBP: 1.3
        JPY: 0.0091
        CAD: 0.79
        CHF: 1.12
        AUD: 0.72
        CNY: 0.15
        INR: 0.012
        MXN: 0.055
        BRL: 0.19

  # Format normalization
  format_normalization:
    enabled: true

    # Date formats
    date:
      target_format: "YYYY-MM-DD"  # ISO 8601

      supported_formats:
        - "DD/MM/YYYY"
        - "MM/DD/YYYY"
        - "DD-MM-YYYY"
        - "MM-DD-YYYY"
        - "DD.MM.YYYY"
        - "DD-MMM-YYYY"
        - "YYYY/MM/DD"
        - "YYYY-MM-DD"
        - "DD MMM YYYY"
        - "MMM DD, YYYY"
        - "DD MMMM YYYY"
        - "MMMM DD, YYYY"

      # Language support for month names
      languages:
        - "en"
        - "fr"

    # Decimal number formatting
    decimal:
      decimal_separator: "."
      thousands_separator: ","
      precision: 2

      # Handle both formats
      input_separators:
        decimal: [".", ","]
        thousands: [",", ".", " "]

    # Currency formatting
    currency:
      position: "prefix"  # $ before number
      symbol: "$"
      space_after_symbol: false

      # Recognize both formats
      input_positions: ["prefix", "suffix"]

    # Boolean normalization
    boolean:
      true_values:
        - "true"
        - "True"
        - "TRUE"
        - "yes"
        - "Yes"
        - "YES"
        - "oui"
        - "Oui"
        - "OUI"
        - "1"
        - "Y"
        - "y"

      false_values:
        - "false"
        - "False"
        - "FALSE"
        - "no"
        - "No"
        - "NO"
        - "non"
        - "Non"
        - "NON"
        - "0"
        - "N"
        - "n"

  # Language detection
  language_detection:
    enabled: true

    # Supported languages
    languages:
      - code: "en"
        name: "English"
      - code: "fr"
        name: "French"

    # Default language if detection fails
    default_language: "en"

  # Whitespace normalization
  whitespace:
    enabled: true

    # Operations
    trim: true  # Remove leading/trailing whitespace
    collapse: true  # Multiple spaces to single space
    normalize_line_breaks: true  # \r\n to \n

  # Case normalization
  case_normalization:
    # Don't normalize by default (preserve original case)
    # Only normalize when specifically needed (e.g., case_insensitive matching)
    enabled: false
    default_case: "original"  # original, lower, upper, title

  # Caching
  caching:
    enabled: true
    ttl_seconds: 3600  # 1 hour
    max_size: 10000  # Maximum cached entries

  # Performance
  performance:
    parallel_normalization: true  # Normalize fields in parallel
    batch_size: 100  # Fields per batch
    timeout_seconds: 30
