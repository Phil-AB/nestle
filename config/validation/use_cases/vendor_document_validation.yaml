# Vendor Document Pre-Validation Use Case — Step 2
#
# Validates commercial invoice, packing list, and (optionally) bill of lading
# against each other BEFORE the BOE is submitted to customs.
#
# Ground-truth facts observed directly from Nestlé Ghana / Vreugdenhil documents:
#
#   Invoice (Vreugdenhil Dairy Foods):
#     - Shipper address present in text layer (Arkerpoort 5, Nijkerk, NL)
#       but visually redacted with orange bars — extraction depends on text layer
#     - Consignee bill-to: Nestlé Ghana Ltd, KIA, Accra, Ghana
#     - Ship-to: Nestlé Ghana Ltd, Sanyo Rd, Tema, Ghana (different from bill-to — expected)
#     - Incoterm labeled "Shipping Condition: FCA ROTTERDAM PORT"
#     - Currency EUR, Total Incl. VAT = 467,775 (= FOB value since VAT = 0)
#     - order_number = "Our Order Number" (64896)
#     - po_number = "Your Order Number" / customer reference (4562599410)
#     - contract_number = 40017796
#     - NO invoice_number field on packing list or BOL — documents linked
#       via order_number / contract_number / po_number
#
#   Packing List (Vreugdenhil):
#     - Top-right seller block is physically REDACTED — do not require shipper fields
#     - Has order_no, contract_no, customer_ref, delivery_terms (= incoterm)
#     - Grand totals on page 2: net 189,000 KG, gross 192,780 KG, units 7,560
#     - 7 containers with individual numbers and seal numbers
#     - No invoice_number field anywhere on the document
#
#   Bill of Lading (Grimaldi Deep Sea):
#     - Shipper block is physically REDACTED — do not require shipper fields
#     - Consignee: Nestle Ghana Ltd, KIA, Accra, Ghana
#     - No formal Incoterm field — states "FREIGHT PAYABLE IN NAPLES / Freight Collect"
#     - Totals on page 2: 7560 BAGS, 189000.00 KG net, 192780.00 KG gross
#     - order_number, contract_number, customer_ref all present on page 2
#     - 7 containers, same IDs as packing list
#     - No invoice_number field anywhere on the document
#
# Ghana Customs Checklist coverage:
#   ✅ Shipper's Address    — invoice (full value) + packing list + BOL (expected REDACTED)
#   ✅ Consignee Address    — invoice + packing list (bill-to vs delivery differ — expected,
#                             do NOT cross-validate address; only validate presence)
#   ❌ Declarant Address    — BOE only (Step 6)
#   ✅ PO Number            — invoice + packing list + BOL (as order/contract/customer ref)
#   ✅ Product Description  — invoice + packing list + BOL (fuzzy: abbreviated vs full name)
#   ❌ H.S. Code            — BOE only (Step 6)
#   ❌ Import Duty          — BOE only (Step 6)
#   ❌ VAT/NHIL             — BOE only (Step 6)
#   ❌ CPC                  — BOE only (Step 6)
#   ✅ FOB Value & Currency — invoice only (FCA = FOB-equivalent; VAT = 0)
#   ✅ Incoterm             — invoice ↔ packing list (BOL has no formal incoterm field)
#   ✅ Insurance            — incoterm rule: FCA/FOB → no insurance on invoice
#   ✅ Freight              — incoterm rule: FCA → freight collect, not billed on invoice
#   ✅ Cargo gross & net weight — invoice ↔ packing list ↔ BOL (±1%)
#   ✅ Country of Origin    — certificate of origin (optional)
#   ✅ Quantity of Goods    — invoice ↔ packing list ↔ BOL (±0.5%)
#   ✅ Number of Containers — packing list ↔ BOL (exact match)
#
# Design principle: no severity tiers — every field on the checklist matters equally.
# Any validation failure requires attention and user confirmation before proceeding.

use_case:
  name: "vendor_document_validation"
  display_name: "Vendor Document Pre-Validation"
  description: "Step 2: validate vendor documents for completeness and cross-document consistency before transmitting to the clearing agent"
  version: "3.0"

  # ── Documents ───────────────────────────────────────────────────────────────
  documents:
    primary:
      type: "invoice"
      role: "source"
      required: true
      description: "Commercial Invoice — primary source of financial and shipment terms"

    supporting:
      - type: "packing_list"
        role: "source"
        required: true
        description: "Packing List — physical shipment details per container"

      - type: "bill_of_lading"
        role: "source"
        required: false
        description: "Bill of Lading or Sea Waybill — carrier's receipt and routing"
        alternatives:
          - "airway_bill"
          - "freight_manifest"

      - type: "certificate_of_origin"
        role: "source"
        required: false
        description: "Certificate of Origin — required for concessionary duty claims"

  # ── Normalization ────────────────────────────────────────────────────────────
  # Synonym mappings resolve label variations across documents before validation.
  # These are derived from actual field labels observed on the real documents.
  normalization:
    enabled: true

    synonyms:
      shipper_name:
        - "shipper_name"
        - "exporter_name"
        - "seller_name"
        - "shipper"
        - "exporter"
        - "seller"

      shipper_address:
        - "shipper_address"
        - "exporter_address"
        - "seller_address"

      consignee_name:
        - "consignee_name"
        - "consignee"
        - "buyer_name"
        - "buyer"
        - "bill_to_name"

      consignee_address:
        - "consignee_address"
        - "bill_to_address"
        - "ship_to_address"
        - "delivery_address"

      invoice_number:
        - "invoice_number"
        - "invoice_no"
        - "invoice_num"

      invoice_date:
        - "invoice_date"
        - "date"

      # FOB / invoice value
      # FCA with VAT=0: Total Excl. VAT = Total Incl. VAT = FOB value
      total_invoice_value:
        - "total_invoice_value"
        - "invoice_total"
        - "total_incl_vat"
        - "Total Incl. VAT"
        - "Total Amount"

      total_fob_value:
        - "total_fob_value"
        - "fob_value"
        - "total_excl_vat"
        - "Total Excl. VAT"
        - "net_amount"

      currency:
        - "currency"
        - "invoice_currency"

      # Incoterm: invoice labels it "Shipping Condition"; packing list labels it "Delivery terms"
      incoterm:
        - "incoterm"
        - "shipping_condition"
        - "delivery_terms"
        - "trade_term"

      # Trade references — the three fields that link invoice ↔ packing list ↔ BOL
      # (there is no invoice_number on packing list or BOL)
      order_number:
        - "order_number"
        - "order_no"
        - "our_order_number"
        - "Order No"
        - "Order no."
        - "ORDER NO."

      contract_number:
        - "contract_number"
        - "contract_no"
        - "Contract no."
        - "Contract No"
        - "CONTRACT NO."

      po_number:
        - "po_number"
        - "customer_ref"
        - "customer_reference"
        - "your_order_number"
        - "Customer ref."
        - "Customer Ref"
        - "CUSTOMER REF."

      product_description:
        - "product_description"
        - "description"
        - "goods_description"
        - "description_of_goods"
        - "kind_of_packages_description_of_goods"

      net_weight:
        - "net_weight"
        - "nett_weight"
        - "weight_net"
        - "Total Net Weight"
        - "NETT WEIGHT"
        - "net_wt"
        - "total_net_weight"
        - "total_sent_net_weight"
        - "nett_weight_kg"

      gross_weight:
        - "gross_weight"
        - "weight_gross"
        - "Total Gross Weight"
        - "GROSS WEIGHT"
        - "gross_wt"
        - "total_gross_weight"
        - "total_sent_gross_weight"

      quantity:
        - "quantity"
        - "total_units"
        - "qty"
        - "Total Units"
        - "total_sent_units"
        - "totals_bags"

      unit_of_measure:
        - "unit_of_measure"
        - "unit"
        - "uom"

      container_count:
        - "container_count"
        - "number_of_containers"
        - "no_of_containers"
        - "Total No. of Containers"
        - "total_containers"
        - "total_no_of_containers"

      container_numbers:
        - "container_numbers"
        - "container_nos"
        - "container_no"
        - "container_ids"

      bl_number:
        - "bl_number"
        - "bl_no"
        - "booking_number"
        - "booking_no"
        - "Bl. No."
        - "Booking No."

      country_of_origin:
        - "country_of_origin"
        - "origin"
        - "origin_country"

    units:
      weight:
        target: "KG"
        conversions:
          MT: 1000
          T: 1000
          TONS: 1000
          G: 0.001
          LBS: 0.453592

    formats:
      date:
        target: "YYYY-MM-DD"
        sources:
          - "DD/MM/YYYY"
          - "MM/DD/YYYY"
          - "DD-MMM-YYYY"
          - "DD-MM-YYYY"
          - "YYYY/MM/DD"
          - "MMM DD, YYYY"
          - "DD.MM.YYYY"

      decimal:
        decimal_separator: "."
        thousands_separator: ","
        precision: 2

  # ── Validation workflow ──────────────────────────────────────────────────────
  workflow:
    type: "sequential"

    steps:

      # ── 1. Invoice completeness ─────────────────────────────────────────────
      # All checklist fields that live on the commercial invoice.
      # Shipper info is invoice-only: packing list and BOL shipper blocks
      # are physically redacted on all Nestlé Ghana supplier documents.
      # consignee_address = bill-to address (KIA, Accra) — presence only,
      # not cross-validated with other docs since delivery address differs.
      - name: "invoice_completeness"
        description: "All required fields must be present on the commercial invoice"
        validators:
          - "required_fields_validator"
        config:
          optional_documents: []
          required_fields:
            invoice:
              - "invoice_number"
              - "invoice_date"
              - "shipper_name"
              - "shipper_address"
              - "consignee_name"
              - "consignee_address"
              - "incoterm"
              - "currency"
              - "total_invoice_value"
              - "net_weight"
              - "gross_weight"
              - "quantity"
              - "product_description"
              - "order_number"
              - "contract_number"
              - "po_number"
        on_failure: "flag_and_continue"

      # ── 2. Packing list completeness ────────────────────────────────────────
      # No invoice_number on packing list — documents are linked via
      # order_number / contract_number / po_number (confirmed from real docs).
      #
      # Shipper fields: The top-left address block on Vreugdenhil packing lists
      # is the BILL-TO (consignee), not the shipper.  _post_process_packing_list
      # renames shipper_* → bill_to_*.  The actual shipper/exporter is the issuing
      # party and is physically redacted.  Shipper validation is invoice-only.
      # Consignee is validated via bill_to_name → consignee_name synonym.
      # incoterm present as "Delivery terms: FCA ROTTERDAM PORT".
      - name: "packing_list_completeness"
        description: "All required fields must be present on the packing list"
        validators:
          - "required_fields_validator"
        config:
          optional_documents: []
          required_fields:
            packing_list:
              - "consignee_name"
              - "consignee_address"
              - "incoterm"
              - "net_weight"
              - "gross_weight"
              - "quantity"
              - "product_description"
              - "order_number"
              - "contract_number"
              - "po_number"
              - "container_count"
              - "container_numbers"
        on_failure: "flag_and_continue"

      # ── 3. Bill of lading completeness ─────────────────────────────────────
      # BOL is optional — silently skipped if not uploaded.
      # Shipper block is physically redacted on BOL but must still be present
      # as a REDACTED marker. No formal incoterm field on BOL (states "Freight
      # Collect" instead — validated via incoterm_rules step).
      # Weights and quantity are in the page 2 totals block.
      - name: "bol_completeness"
        description: "Required fields must be present on the bill of lading when provided"
        validators:
          - "required_fields_validator"
        config:
          optional_documents:
            - "bill_of_lading"
          required_fields:
            bill_of_lading:
              - "bl_number"
              - "shipper_name"
              - "shipper_address"
              - "consignee_name"
              - "container_count"
              - "container_numbers"
              - "net_weight"
              - "gross_weight"
              - "quantity"
              - "order_number"
              - "contract_number"
              - "po_number"
        on_failure: "flag_and_continue"

      # ── 4. Consignee name cross-validation ─────────────────────────────────
      # Consignee name must match across invoice, packing list, and BOL.
      # Fuzzy matching required: "Nestlé Ghana Limited" vs "Nestle Ghana Ltd".
      # Consignee ADDRESS is intentionally NOT cross-validated — bill-to address
      # (KIA, Accra) legitimately differs from ship-to address (Sanyo Rd, Tema).
      - name: "consignee_identity"
        description: "Consignee name must match across all vendor documents (fuzzy)"
        validators:
          - "shipper_consignee_validator"
        config:
          parties:
            - name: "consignee"
              documents:
                - "invoice"
                - "packing_list"
                - "bill_of_lading"
              field_mappings:
                invoice: "consignee_name"
                packing_list: "consignee_name"
                bill_of_lading: "consignee_name"
              match_type: "fuzzy"
              fuzzy_threshold: 0.75
              min_documents: 2
          normalization:
            remove_whitespace: true
            remove_punctuation: true
            lowercase: true
            remove_company_suffixes: true
        on_failure: "flag_and_continue"

      # ── 5. Trade reference consistency ─────────────────────────────────────
      # order_number, contract_number, and po_number are the three fields that
      # tie invoice ↔ packing list ↔ BOL together. All three must match exactly
      # across every document that carries them.
      # require_all: false — graceful skip if a document doesn't carry the field,
      # but a mismatch when both sides are present is always a failure.
      - name: "order_number_consistency"
        description: "Supplier order number must match across invoice, packing list, and BOL"
        validators:
          - "n_way_matcher"
        config:
          field_name: "order_number"
          documents:
            - "invoice"
            - "packing_list"
            - "bill_of_lading"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      - name: "contract_number_consistency"
        description: "Contract number must match across invoice, packing list, and BOL"
        validators:
          - "n_way_matcher"
        config:
          field_name: "contract_number"
          documents:
            - "invoice"
            - "packing_list"
            - "bill_of_lading"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      - name: "po_number_consistency"
        description: "Customer PO reference must match across invoice, packing list, and BOL"
        validators:
          - "n_way_matcher"
        config:
          field_name: "po_number"
          documents:
            - "invoice"
            - "packing_list"
            - "bill_of_lading"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      # ── 6. Product description consistency ─────────────────────────────────
      # Invoice: "FFP 28% MQAV004F-1 25kg bag" (abbreviated SAP description)
      # Packing list + BOL: "Instant Fat Filled Powder 28% veg. fat, vit & min
      # enriched, MQAV004F-1, 25 kg bag" (full description)
      # Fuzzy matching is required to reconcile these two forms.
      - name: "product_description_consistency"
        description: "Product description must be semantically consistent across all documents"
        validators:
          - "n_way_matcher"
        config:
          field_name: "product_description"
          documents:
            - "invoice"
            - "packing_list"
            - "bill_of_lading"
          match_type: "fuzzy"
          require_all: false
        on_failure: "flag_and_continue"

      # ── 7. Incoterm consistency ─────────────────────────────────────────────
      # Invoice: "Shipping Condition: FCA ROTTERDAM PORT"
      # Packing list: "Delivery terms: FCA ROTTERDAM PORT"
      # BOL: no formal incoterm — excluded from this check.
      # Both invoice and packing list are required docs so require_all: true.
      - name: "incoterm_consistency"
        description: "Incoterm must match between invoice and packing list"
        validators:
          - "n_way_matcher"
        config:
          field_name: "incoterm"
          documents:
            - "invoice"
            - "packing_list"
          match_type: "fuzzy"
          require_all: true
        on_failure: "flag_and_continue"

      # ── 8. Incoterm freight and insurance rules ─────────────────────────────
      # FCA / FOB: freight must NOT appear on the invoice (freight is collect).
      #            insurance must NOT appear on the invoice.
      # CFR:       freight must be present; insurance not required.
      # CIF:       freight and insurance must both be present.
      - name: "incoterm_rules"
        description: "Freight and insurance values must comply with the declared incoterm"
        validators:
          - "incoterm_validator"
        config:
          validations:
            - incoterm_field: "invoice.incoterm"
              freight_field: "invoice.freight_value"
              insurance_field: "invoice.insurance_value"
              fob_field: "invoice.total_fob_value"
          tolerance: 0.01
        on_failure: "flag_and_continue"

      # ── 9. Net weight consistency ───────────────────────────────────────────
      # invoice ↔ packing list: both are required documents — strict check.
      # invoice ↔ BOL: BOL is optional; skip gracefully if not uploaded.
      # BOL page 2 totals block carries the shipment-level net weight (189,000 KG).
      - name: "net_weight_consistency"
        description: "Net weight must agree across invoice, packing list, and BOL (±1%)"
        validators:
          - "tolerance_validator"
        config:
          tolerance_type: "percentage"
          default_tolerance: 1.0
          validations:
            - name: "net_weight_invoice_to_packing"
              source: "invoice.net_weight"
              target: "packing_list.net_weight"
              tolerance_percent: 1.0
              operator: "equals"
            - name: "net_weight_invoice_to_bol"
              source: "invoice.net_weight"
              target: "bill_of_lading.net_weight"
              tolerance_percent: 1.0
              operator: "equals"
              optional_target: true
        on_failure: "flag_and_continue"

      # ── 10. Gross weight consistency ────────────────────────────────────────
      - name: "gross_weight_consistency"
        description: "Gross weight must agree across invoice, packing list, and BOL (±1%)"
        validators:
          - "tolerance_validator"
        config:
          tolerance_type: "percentage"
          default_tolerance: 1.0
          validations:
            - name: "gross_weight_invoice_to_packing"
              source: "invoice.gross_weight"
              target: "packing_list.gross_weight"
              tolerance_percent: 1.0
              operator: "equals"
            - name: "gross_weight_invoice_to_bol"
              source: "invoice.gross_weight"
              target: "bill_of_lading.gross_weight"
              tolerance_percent: 1.0
              operator: "equals"
              optional_target: true
        on_failure: "flag_and_continue"

      # ── 11. Quantity consistency ────────────────────────────────────────────
      - name: "quantity_consistency"
        description: "Quantity must agree across invoice, packing list, and BOL (±0.5%)"
        validators:
          - "tolerance_validator"
        config:
          tolerance_type: "percentage"
          default_tolerance: 0.5
          validations:
            - name: "quantity_invoice_to_packing"
              source: "invoice.quantity"
              target: "packing_list.quantity"
              tolerance_percent: 0.5
              operator: "equals"
            - name: "quantity_invoice_to_bol"
              source: "invoice.quantity"
              target: "bill_of_lading.quantity"
              tolerance_percent: 0.5
              operator: "equals"
              optional_target: true
        on_failure: "flag_and_continue"

      # ── 12. Container count consistency ────────────────────────────────────
      # packing list has 7 containers; BOL carrier's receipt states 7.
      # Both sides optional since BOL may not be uploaded.
      - name: "container_count_consistency"
        description: "Container count must match between packing list and BOL"
        validators:
          - "n_way_matcher"
        config:
          field_name: "container_count"
          documents:
            - "packing_list"
            - "bill_of_lading"
          match_type: "exact"
          require_all: false
        on_failure: "flag_and_continue"

      # ── 13. Container numbers consistency ──────────────────────────────────
      # The same 7 container IDs must appear on both packing list and BOL.
      # Normalized match handles any ordering differences.
      - name: "container_numbers_consistency"
        description: "Container IDs must match exactly between packing list and BOL"
        validators:
          - "n_way_matcher"
        config:
          field_name: "container_numbers"
          documents:
            - "packing_list"
            - "bill_of_lading"
          match_type: "normalized"
          require_all: false
        on_failure: "flag_and_continue"

      # ── 14. Country of origin ───────────────────────────────────────────────
      # Only validated when a Certificate of Origin is uploaded.
      # Skipped silently if the document is not provided.
      - name: "country_of_origin"
        description: "Country of origin must be present on the Certificate of Origin"
        validators:
          - "required_fields_validator"
        config:
          optional_documents:
            - "certificate_of_origin"
          required_fields:
            certificate_of_origin:
              - "country_of_origin"
              - "consignee_name"
        on_failure: "flag_and_continue"

  # ── Discrepancy handling ─────────────────────────────────────────────────────
  # No severity classification — every discrepancy is equally important.
  # Any failure triggers user confirmation before the shipment can proceed.
  discrepancy_handling:
    auto_fix:
      enabled: true
      rules:
        - type: "format_normalization"
          issues:
            - "date_format"
            - "number_format"
        - type: "unit_conversion"
          issues:
            - "weight_unit"
        - type: "synonym_resolution"
          issues:
            - "field_name_variation"

    user_confirmation:
      # Any discrepancy — regardless of type — requires explicit user confirmation
      # before the shipment record is marked ready for clearing agent submission.
      required_for: "any_discrepancy"

  # ── Missing data ─────────────────────────────────────────────────────────────
  missing_data:
    strategy: "continue_with_partial"
    # Shipment record is marked incomplete if any of these invoice fields are absent
    incomplete_if_missing:
      - "invoice_number"
      - "total_invoice_value"
      - "currency"
      - "incoterm"

  # ── Reporting ────────────────────────────────────────────────────────────────
  reporting:
    enabled: true
    export_formats:
      - "json"
      - "pdf"
    include:
      - "validation_results"
      - "discrepancies"
      - "auto_fixes_applied"
      - "user_confirmations"
      - "audit_trail"

  # ── Metadata ─────────────────────────────────────────────────────────────────
  metadata:
    created_by: "Nestle IMPEX Automation"
    created_at: "2026-04-13"
    use_case_category: "customs_clearance"
    workflow_step: "step_2_pre_transmit"
    checklist_version: "Ghana Customs — vendor doc checklist v1"
