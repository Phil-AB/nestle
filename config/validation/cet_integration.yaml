# CET (Common External Tariff) Integration Configuration
# Ghana Customs - HS Code Validation

cet_integration:
  enabled: true

  # Path to CET file
  file_path: "config/data/CET_Ghana.csv"

  # Column mappings (CET file structure)
  columns:
    hs_code: "E"  # Column E: HS Code ID
    description: "C"  # Column C: Description of goods
    duty_rate: "Rate"  # Duty rate column
    section: "A"  # Section
    chapter: "B"  # Chapter
    stat_code: "Stat_Code"  # Statistical code
    unit: "Unit"  # Measurement unit

  # File encoding
  encoding: "utf-8"

  # Caching settings
  caching:
    enabled: true
    ttl_hours: 24  # Cache CET for 24 hours
    auto_reload: true  # Auto-reload if file changes

  # Validation settings
  validation:
    # Verify HS code exists in CET
    verify_hs_code_exists: true

    # Verify description similarity
    verify_description: true
    description_similarity_threshold: 0.6  # 60% similarity required

    # Verify duty rate matches
    verify_duty_rate: true
    duty_rate_tolerance_percent: 0.1  # ±0.1% tolerance

  # Fuzzy matching settings
  fuzzy_matching:
    enabled: true
    algorithm: "word_overlap"  # "word_overlap", "levenshtein", "jaccard"
    min_similarity: 0.6

  # HS code normalization
  normalization:
    remove_dots: true  # 1234.56 → 123456
    remove_spaces: true
    uppercase: true

  # Search settings
  search:
    max_results: 5  # Max results for description search
    enable_partial_match: true

  # Error handling
  error_handling:
    on_cet_not_loaded: "warn"  # "fail", "warn", "skip"
    on_hs_code_not_found: "flag"  # "fail", "flag", "skip"
    on_description_mismatch: "flag"  # "fail", "flag", "skip"

  # Reporting
  reporting:
    include_cet_info: true  # Include CET info in validation results
    include_similarity_scores: true
    include_suggestions: true  # Suggest alternative HS codes

# CET File Metadata
metadata:
  source: "Ghana Customs Authority"
  version: "2024"
  last_updated: "2024-01-01"
  total_entries: 70  # Sample entries
  coverage:
    - "Section I: Live Animals (Chapters 01-05)"
    - "Section II: Vegetable Products (Chapters 06-14)"
    - "Section III: Fats and Oils (Chapter 15)"
    - "Section XVI: Machinery (Chapters 84-85)"
    - "Section XVII: Vehicles (Chapter 87)"
    - "... more sections"

# Known HS Code Ranges
hs_code_ranges:
  live_animals: "01.01 - 05.99"
  vegetable_products: "06.01 - 14.99"
  fats_oils: "15.01 - 15.99"
  food_products: "16.01 - 24.99"
  mineral_products: "25.01 - 27.99"
  chemicals: "28.01 - 38.99"
  plastics_rubber: "39.01 - 40.99"
  hides_skins: "41.01 - 43.99"
  wood_products: "44.01 - 46.99"
  textiles: "50.01 - 63.99"
  footwear_headgear: "64.01 - 67.99"
  stone_cement: "68.01 - 70.99"
  precious_stones: "71.01 - 71.99"
  base_metals: "72.01 - 83.99"
  machinery: "84.01 - 85.99"
  vehicles: "86.01 - 89.99"
  optical_instruments: "90.01 - 92.99"
  arms_ammunition: "93.01 - 93.99"
  miscellaneous: "94.01 - 96.99"
  art_antiques: "97.01 - 99.99"

# Integration with Validators
validators:
  cet_hs_code_validator:
    enabled: true
    priority: "high"  # Run early in validation workflow
    fail_on_error: false  # Don't fail entire validation if CET unavailable

# Performance Tuning
performance:
  lazy_loading: true  # Load CET on first use
  indexing: true  # Build index for fast lookup
  parallel_lookups: false  # Sequential for now (can enable for high volume)
  max_memory_mb: 100  # Max memory for CET data

# Monitoring
monitoring:
  log_lookups: true
  log_level: "INFO"
  track_statistics: true
  metrics:
    - "total_lookups"
    - "cache_hits"
    - "cache_misses"
    - "average_lookup_time_ms"

# Testing
testing:
  sample_hs_codes:
    - code: "0101.21"
      description: "Live horses"
      expected_duty_rate: 5.0

    - code: "8419.50"
      description: "Heat exchange machinery"
      expected_duty_rate: 10.0

    - code: "8703.00"
      description: "Motor cars"
      expected_duty_rate: 20.0

    - code: "1234.99"
      description: "Invalid code"
      expected_found: false

# Documentation
documentation:
  readme: "config/data/CET_README.md"
  examples: "examples/cet_validation_example.py"
  api_docs: "docs/cet_integration.md"
